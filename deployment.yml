apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web-app
  namespace: devops-app
spec:
  replicas:
  selector:
    matchLabels:
      app: devops-web-app
  template:
    metadata:
      labels:
        app: devops-web-app
    spec:
      containers:
      - name: devops-web-app
        image: DESKTOP-TLPR3OL/devops-web-app:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        # Cek apakah container sudah siap menerima traffic
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        # Cek apakah container masih hidup
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
