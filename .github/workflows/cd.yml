name: CD Pipeline

on:
  push:
    branches: [ main ]   # Hanya deploy jika push ke branch main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil kode terbaru
      uses: actions/checkout@v3

    - name: Login ke Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build dan push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-web-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-web-app:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Deploy ke server staging
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # Pull image terbaru
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-web-app:latest

          # Hentikan container lama (jika ada)
          docker stop devops-app || true
          docker rm devops-app || true

          # Jalankan container baru
          docker run -d \
            --name devops-app \
            -p 3000:3000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-web-app:latest

          echo "Deployment berhasil!"

    - name: Verifikasi deployment
      run: |
        sleep 10
        echo "Cek status aplikasi..."
        curl --fail http://${{ secrets.SERVER_HOST }}:3000/health || exit 1
        echo "Aplikasi berjalan normal!"
