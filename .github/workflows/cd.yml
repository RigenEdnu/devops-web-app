name: Build Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t devops-web-app:latest .
      - name: ✓ Build sukses!
        run: echo "Docker image siap deploy"
